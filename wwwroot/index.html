    <script>
        // Dark by default; only use light if the visitor chose it before

            var t = 'dark';
            try { if (localStorage.getItem('theme') === 'light') t = 'light'; } catch (e) { }
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
